{% extends "auth/base_acesso.html" %}
{% block conteudo %}
<h1>Recuperar acesso</h1>
<p class="silencioso pequeno" style="margin-top:0;">
  Enviaremos um link de redefinição válido por 30 minutos.
</p>

<form method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="campo">
    <label for="email">E-mail corporativo</label>
    <input type="email" id="email" name="email" autocomplete="username" required autofocus>
  </div>
  <button type="submit" class="botao botao-primario" style="width:100%; justify-content:center;">
    Enviar link
  </button>
  <p class="pequeno" style="margin-top:14px;">
    <a href="{{ url_for('auth.login') }}">Voltar para o login</a>
  </p>
</form>
{% endblock %}
